<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">Shipyard architecture</title>
<desc id="d">People talk in Discord or Mattermost. Switch bridges the rooms and tells the Gatekeeper who sent each message. The Gatekeeper checks roles, asks for approvals, applies the SBOM gate, keeps the Board and writes the audit log, and is the only part that holds credentials for Coolify, Kubernetes, GitHub and SigNoz. The Ops and Repo agents hold none and can only ask the Gatekeeper.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
</defs>
<rect width="1100" height="700" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
<text x="30" y="42" font-size="20" font-weight="700" fill="#0f172a">How Shipyard fits together</text>
<text x="30" y="64" font-size="13" fill="#64748b">Everything that can change something goes through one small program, and the agents can only ask it.</text>

<!-- chat -->
<text x="30" y="104" font-size="12" font-weight="700" fill="#64748b" letter-spacing="1">PEOPLE, IN CHAT</text>
<g font-size="15" fill="#0f172a">
<rect x="30" y="118" width="190" height="56" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/><text x="48" y="142" font-weight="700">Discord</text><text x="48" y="162" font-size="12" fill="#64748b">a server's channels</text>
<rect x="30" y="188" width="190" height="56" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/><text x="48" y="212" font-weight="700">Mattermost</text><text x="48" y="232" font-size="12" fill="#64748b">bundled with Switch</text>
<rect x="30" y="258" width="190" height="56" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-dasharray="5 4"/><text x="48" y="282" font-weight="700" fill="#64748b">Slack</text><text x="48" y="302" font-size="12" fill="#94a3b8">same bridge, not run here</text>
</g>
<text x="30" y="344" font-size="12" fill="#475569">owner · maintainer · deployer · viewer</text>
<text x="30" y="362" font-size="12" fill="#475569">each known by their chat account</text>

<!-- switch -->
<rect x="270" y="104" width="220" height="372" rx="14" fill="#eff6ff" stroke="#93c5fd"/>
<text x="290" y="134" font-size="17" font-weight="700" fill="#1d4ed8">Switch</text>
<text x="290" y="154" font-size="12" fill="#475569">the chat layer</text>
<g font-size="13" fill="#0f172a">
<rect x="288" y="172" width="184" height="40" rx="8" fill="#ffffff" stroke="#bfdbfe"/><text x="302" y="197">Rooms bridged to chat</text>
<rect x="288" y="220" width="184" height="40" rx="8" fill="#ffffff" stroke="#bfdbfe"/><text x="302" y="245">Real sender identity</text>
<rect x="288" y="268" width="184" height="40" rx="8" fill="#ffffff" stroke="#bfdbfe"/><text x="302" y="293">Addressing policy</text>
<rect x="288" y="316" width="184" height="40" rx="8" fill="#ffffff" stroke="#bfdbfe"/><text x="302" y="341">Agent protocol</text>
<rect x="288" y="364" width="184" height="40" rx="8" fill="#ffffff" stroke="#bfdbfe"/><text x="302" y="389">Templates</text>
</g>
<text x="290" y="436" font-size="12" fill="#475569">Refuses messages to an agent from</text>
<text x="290" y="454" font-size="12" fill="#475569">anyone outside the project.</text>

<!-- gatekeeper -->
<rect x="540" y="104" width="300" height="372" rx="14" fill="#eef2ff" stroke="#818cf8" stroke-width="1.5"/>
<text x="560" y="134" font-size="17" font-weight="700" fill="#3730a3">Gatekeeper</text>
<text x="560" y="154" font-size="12" fill="#475569">a custom Switch agent</text>
<g font-size="13" fill="#0f172a">
<rect x="558" y="172" width="264" height="44" rx="8" fill="#ffffff" stroke="#c7d2fe"/><text x="572" y="199">Roles · single-use approvals</text>
<rect x="558" y="224" width="264" height="44" rx="8" fill="#ffffff" stroke="#c7d2fe"/><text x="572" y="251">SBOM gate on every deploy</text>
<rect x="558" y="276" width="264" height="44" rx="8" fill="#ffffff" stroke="#c7d2fe"/><text x="572" y="303">Hash-chained audit log</text>
<rect x="558" y="328" width="264" height="44" rx="8" fill="#ffffff" stroke="#c7d2fe"/><text x="572" y="355">Board: tickets · briefings · incidents</text>
<rect x="558" y="380" width="264" height="44" rx="8" fill="#ffffff" stroke="#c7d2fe"/><text x="572" y="407">Alerts · room sync · daily digest</text>
</g>
<text x="560" y="446" font-size="12" fill="#475569">The only part that holds credentials.</text><text x="560" y="464" font-size="12" fill="#475569">Fails closed: unreachable means "no".</text>

<!-- stack -->
<text x="890" y="104" font-size="12" font-weight="700" fill="#64748b" letter-spacing="1">YOUR STACK</text>
<g font-size="15" fill="#0f172a">
<rect x="890" y="118" width="180" height="56" rx="10" fill="#f0fdf4" stroke="#86efac"/><text x="906" y="142" font-weight="700">Coolify</text><text x="906" y="162" font-size="12" fill="#64748b">deploy · rollback · logs</text>
<rect x="890" y="188" width="180" height="56" rx="10" fill="#f0fdf4" stroke="#86efac"/><text x="906" y="212" font-weight="700">Kubernetes</text><text x="906" y="232" font-size="12" fill="#64748b">3 scoped accounts</text>
<rect x="890" y="258" width="180" height="56" rx="10" fill="#f0fdf4" stroke="#86efac"/><text x="906" y="282" font-weight="700">GitHub</text><text x="906" y="302" font-size="12" fill="#64748b">App · PRs · CI · SBOM</text>
<rect x="890" y="328" width="180" height="56" rx="10" fill="#f0fdf4" stroke="#86efac"/><text x="906" y="352" font-weight="700">SigNoz</text><text x="906" y="372" font-size="12" fill="#64748b">read-only logs · alerts</text>
</g>
<text x="890" y="410" font-size="12" fill="#475569">Each credential is the smallest one</text>
<text x="890" y="428" font-size="12" fill="#475569">that does the job.</text>

<!-- arrows -->
<g stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#a)" marker-start="url(#a)">
<path d="M222 216 H268"/>
<path d="M492 216 H538"/>
<path d="M842 146 H888"/><path d="M842 216 H888"/><path d="M842 286 H888"/><path d="M842 356 H888"/>
<path d="M380 478 V520"/>
<path d="M690 478 V520"/>
</g>
<g stroke="#4338ca" stroke-width="1.8" fill="none" marker-end="url(#a)">
<path d="M490 580 H512 V440 H538"/>
</g>
<g font-size="11" fill="#475569"><text x="226" y="208">messages</text><text x="496" y="208">who · what</text><text x="846" y="138">act · alert</text></g>

<!-- agents -->
<rect x="270" y="522" width="220" height="86" rx="12" fill="#ecfeff" stroke="#67e8f9"/>
<text x="288" y="548" font-size="15" font-weight="700" fill="#0e7490">Ops Agent · Repo Agent</text>
<text x="288" y="570" font-size="12" fill="#475569">Codex, on an unprivileged user.</text>
<text x="288" y="588" font-size="12" fill="#475569">No credentials. They only ask.</text>

<!-- dashboard -->
<rect x="540" y="522" width="300" height="86" rx="12" fill="#faf5ff" stroke="#d8b4fe"/>
<text x="558" y="548" font-size="15" font-weight="700" fill="#6b21a8">Dashboard</text>
<text x="558" y="570" font-size="12" fill="#475569">audit · approvals · SBOM · Board · roles · rooms</text>
<text x="558" y="588" font-size="12" fill="#475569">tunnel, or your address only. No approve button.</text>

<!-- installer -->
<rect x="30" y="634" width="1040" height="44" rx="10" fill="#0f172a"/>
<text x="50" y="661" font-size="14" font-weight="700" fill="#ffffff">Guided installer</text>
<text x="190" y="661" font-size="13" fill="#cbd5e1">Switch · agents · GitHub App (2 clicks) · Kubernetes · SigNoz · Discord · browser pages · owner by whoami</text>
</svg>
