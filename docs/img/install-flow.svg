<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 330" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">The guided install</title>
<desc id="d">Seven steps from a blank Ubuntu machine to a working Shipyard. The installer does the machine work; the person only signs in, creates tokens and presses buttons that only they can press.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<rect width="1100" height="330" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
<text x="30" y="42" font-size="20" font-weight="700" fill="#0f172a">One command, then only what a person can do</text>
<text x="30" y="64" font-size="13" fill="#64748b">The installer checks every value the moment you give it, and picks up where it stopped if anything fails.</text>
<g font-size="13" fill="#0f172a">
<rect x="30" y="92" width="140" height="132" rx="12" fill="#eff6ff" stroke="#93c5fd"/><text x="46" y="120" font-weight="700">1 Machine</text><text x="46" y="142" font-size="12" fill="#475569">disk, memory, sudo</text><text x="46" y="166" font-size="12" fill="#1d4ed8" font-weight="700">installer</text><text x="46" y="184" font-size="12" fill="#475569">checks, installs</text><text x="46" y="202" font-size="12" fill="#475569">Docker</text>
<rect x="186" y="92" width="140" height="132" rx="12" fill="#eff6ff" stroke="#93c5fd"/><text x="202" y="120" font-weight="700">2 Switch</text><text x="202" y="142" font-size="12" fill="#475569">and Mattermost</text><text x="202" y="166" font-size="12" fill="#1d4ed8" font-weight="700">installer</text><text x="202" y="184" font-size="12" fill="#475569">starts them; they</text><text x="202" y="202" font-size="12" fill="#475569">survive a reboot</text>
<rect x="342" y="92" width="140" height="132" rx="12" fill="#fffbeb" stroke="#fcd34d"/><text x="358" y="120" font-weight="700">3 Agents</text><text x="358" y="142" font-size="12" fill="#475569">Codex, sealed off</text><text x="358" y="166" font-size="12" fill="#b45309" font-weight="700">you</text><text x="358" y="184" font-size="12" fill="#475569">open a link, type</text><text x="358" y="202" font-size="12" fill="#475569">a code</text>
<rect x="498" y="92" width="140" height="132" rx="12" fill="#eff6ff" stroke="#93c5fd"/><text x="514" y="120" font-weight="700">4 Shipyard</text><text x="514" y="142" font-size="12" fill="#475569">rooms, Gatekeeper</text><text x="514" y="166" font-size="12" fill="#1d4ed8" font-weight="700">installer</text><text x="514" y="184" font-size="12" fill="#475569">writes the config,</text><text x="514" y="202" font-size="12" fill="#475569">starts it</text>
<rect x="654" y="92" width="140" height="132" rx="12" fill="#fffbeb" stroke="#fcd34d"/><text x="670" y="120" font-weight="700">5 GitHub</text><text x="670" y="142" font-size="12" fill="#475569">App, from a manifest</text><text x="670" y="166" font-size="12" fill="#b45309" font-weight="700">you</text><text x="670" y="184" font-size="12" fill="#475569">two clicks; the keys</text><text x="670" y="202" font-size="12" fill="#475569">save themselves</text>
<rect x="810" y="92" width="140" height="132" rx="12" fill="#fffbeb" stroke="#fcd34d"/><text x="826" y="120" font-weight="700">6 Connect</text><text x="826" y="142" font-size="12" fill="#475569">Kubernetes, SigNoz,</text><text x="826" y="160" font-size="12" fill="#475569">Discord</text><text x="826" y="184" font-size="12" fill="#b45309" font-weight="700">you</text><text x="826" y="202" font-size="12" fill="#475569">pick, paste, invite</text>
<rect x="966" y="92" width="104" height="132" rx="12" fill="#f0fdf4" stroke="#86efac"/><text x="982" y="120" font-weight="700">7 Owner</text><text x="982" y="142" font-size="12" fill="#475569">whoami</text><text x="982" y="166" font-size="12" fill="#15803d" font-weight="700">you</text><text x="982" y="184" font-size="12" fill="#475569">type one</text><text x="982" y="202" font-size="12" fill="#475569">message</text>
</g>
<g stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#a)">
<path d="M172 158 H184"/><path d="M328 158 H340"/><path d="M484 158 H496"/><path d="M640 158 H652"/><path d="M796 158 H808"/><path d="M952 158 H964"/>
</g>
<rect x="30" y="248" width="14" height="14" rx="3" fill="#eff6ff" stroke="#93c5fd"/><text x="52" y="260" font-size="12" fill="#475569">the installer does it</text>
<rect x="200" y="248" width="14" height="14" rx="3" fill="#fffbeb" stroke="#fcd34d"/><text x="222" y="260" font-size="12" fill="#475569">only you can: sign in, create a token, press a button</text>
<text x="30" y="298" font-size="12" fill="#475569">Run again after any failure: it looks at what is really on the machine and continues. Unattended installs read an answers file instead.</text>
</svg>
