[project]
name = "shipyard"
version = "0.1.0"
description = "Chat-native ops room: Switch agents behind a role-based, approval-gated Gatekeeper"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["shipyard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
shipyard = ["web/*"]
