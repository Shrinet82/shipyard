# Shipyard policy. Chat identities are Switch sender ids, exactly as `@gatekeeper whoami` prints them.
# Never use display names. Agents must never be listed as members.
switch:
  url: http://localhost:8000
  credentials_file: ~/gatekeeper.json        # {"id": ..., "api_key": ..., "name": "gatekeeper"}
coolify:
  url: http://172.31.3.18:8000
  token_file: ~/coolify.env                   # COOLIFY_TOKEN=... (needs Deploy and Write)
gatekeeper:
  mcp_port: 8765
  mcp_token_file: ~/gatekeeper-mcp.token
  db_path: ~/shipyard.db

github:                                       # a GitHub App installed on the repo (see docs/PHASE2.md)
  app_id: ""                                  # leave empty to run without GitHub features
  private_key_file: ~/shipyard-github.pem
  poll_seconds: 60
  stale_hours: 48
  webhook_secret_file: ~/shipyard-github-webhook.secret   # with this file present, GitHub's signed webhooks are accepted (python3 -m shipyard github-webhook)
alerts:                                       # Coolify's webhook posts here; the URL carries a secret
  port: 8766
  evidence_lines: 40
  agent: ops-agent
  restart_limit: 5                            # a Kubernetes pod restarted this often is an alert
  cluster_poll_seconds: 60                    # how often the cluster is looked at (0 turns it off)
digest:
  hour: 9
  minute: 0
  timezone: Asia/Kolkata

hosts:                                        # production VMs reachable by the allowlisted `shell` command
  prod:
    ssh: shipyard-ops@10.0.0.2                # the forced-command account (see deploy/ops-shell)
    key_file: ~/.ssh/shipyard-ops
kubernetes:                                   # one least-privilege ServiceAccount credential per kind of action
  kubectl: /usr/local/bin/kubectl
  max_replicas: 10
  kubeconfigs: {viewer: ~/kube/viewer.kubeconfig, deployer: ~/kube/deployer.kubeconfig, ops: ~/kube/ops.kubeconfig}

discord:
  token_file: ""                              # an env file with DISCORD_BOT_TOKEN (Switch's own bot): lets the room sync READ the server's channel list. Empty = off
rooms_file: ~/shipyard-rooms.json             # rooms made by the room sync (dashboard: Switch rooms → Sync rooms; chat: `@gatekeeper rooms sync`)
desks_file: ~/shipyard-desks.json             # which personal desk room is whose (`@gatekeeper desks create`)
projects:
  demo:
    rooms:                                    # Switch room ids
      ops: ["00000000-0000-0000-0000-000000000001"]          # commands and deploys
      maintainers: ["00000000-0000-0000-0000-000000000002"]  # PR alerts, the digest, SBOM reports
      incidents: ["00000000-0000-0000-0000-000000000003"]    # optional: alerts and the Ops Agent's diagnosis land here; the ops rooms hear the alert too
    ticket_prefix: SY                         # Board ticket keys: SY-1, SY-2, ...
    on_call: "@switch-discord-BRIDGE-owner:localhost"   # optional: who automatic alert tickets are assigned to
    servers: []                               # Coolify server uuids this project owns, for disk alerts (not needed with one project)
    exec_host: prod                           # the host (from `hosts:`) that runs the Coolify containers, for `exec <app> <command>`
    apps:                                     # app name -> Coolify application uuid
      demo-web: "aaaaaaaaaaaaaaaaaaaaaaaa"
      demo-k8s: {backend: k8s, namespace: demo, deployment: demo-k8s}   # namespace comes from here, never from chat
    repo:
      name: owner/repo
      app: demo-web                           # deployed after a merge
      required_checks: [test, sbom]           # CI is green only when these succeed
      merge_method: squash
      branch: main                            # the branch whose head `deploy` ships and the SBOM gate judges
    github_logins:                            # who is who on GitHub, for the digest
      "@switch-discord-BRIDGE-owner:localhost": owner-login
    members:
      "@switch-discord-BRIDGE-owner:localhost": owner
      "@switch-discord-BRIDGE-maint:localhost": maintainer
      "@switch-discord-BRIDGE-deployer:localhost": deployer
      "@switch-discord-BRIDGE-viewer:localhost": viewer

# Tier per action. Unlisted actions are denied (fail closed).
actions:
  coolify.status:    read
  coolify.logs:      read
  coolify.history:   read
  k8s.status:        read
  k8s.logs:          read
  k8s.events:        read
  repo.pr_list:      read
  repo.pr_status:    read
  repo.ci:           read
  repo.digest:       read
  audit.read:        read
  sbom.read:         read
  coolify.deploy:    change
  coolify.restart:   change
  k8s.restart:       change
  k8s.rollback:      change      # needs approval: see approval_overrides
  k8s.scale:         change
  coolify.rollback:  change      # the Phase 1 exit check wants owner approval: see approval_overrides
  repo.merge:        dangerous
  ops.shell:         dangerous
  coolify.exec:      change      # allowlisted read-only commands inside an app's container (about 50: ls, cat, tail, ps, curl localhost ...)
  k8s.exec:          change      # the same list inside a pod
  repo.suggestions:  read
  repo.apply_suggestion: dangerous   # a reviewer's suggested change, applied to the PR branch; needs a second person
  ticket.delete:     dangerous   # Board tickets: every other ticket action is checked by the role matrix in shipyard/tickets.py
  secrets.read:      dangerous
  coolify.stop_prod: dangerous
  coolify.delete:    dangerous
  deploy.override_cve_gate: dangerous
  ops.firewall:      blocked
  repo.force_push_main: blocked

# Dangerous actions that need more than maintainer to even request.
min_role:
  ops.shell: owner
  coolify.exec: maintainer
  k8s.exec: maintainer
  ticket.delete: owner

# Change-tier actions that still need an approval (second person or owner).
approval_overrides:
  coolify.rollback: true
  k8s.rollback: true

approval_timeout_seconds: 600

# SBOM reports and the deploy gate (Phase 4). CI makes the SBOM and the scan; we collect, compare and decide.
sbom:
  workflow: .github/workflows/ci.yml          # the only workflow whose artifacts are believed
  data_dir: ~/shipyard-sbom
  poll_seconds: 90
  copyleft: [AGPL, GPL, SSPL, EUPL, OSL, CC-BY-SA]   # licence families flagged in reports (report only: a licence never blocks a deploy)

# The Board (tickets): a daily standup in the maintainers rooms, IST. Leave empty to turn the standup off.
tickets:
  standup_at: "09:00"

# The dashboard listens on loopback only; reach it with: ssh -L 8780:localhost:8780 <vm>
dashboard:
  port: 8780
  session_hours: 8
  public_url: http://localhost:8780           # used for the links the Board posts in chat
  members_file: ~/shipyard-members.json       # roles edited in the dashboard are kept here and win over `members:` above
