# Shipyard policy. Chat identities are Switch sender ids, exactly as `!whoami` prints them.
# Never use display names. Agents must never be listed as members.
switch:
  url: http://localhost:8000
  credentials_file: ~/gatekeeper.json        # {"id": ..., "api_key": ..., "name": "gatekeeper"}
coolify:
  url: http://172.31.3.18:8000
  token_file: ~/coolify.env                   # COOLIFY_TOKEN=... (needs Deploy and Write)
gatekeeper:
  mcp_port: 8765
  mcp_token_file: ~/gatekeeper-mcp.token
  db_path: ~/shipyard.db

github:                                       # a GitHub App installed on the repo (see docs/PHASE2.md)
  app_id: ""                                  # leave empty to run without GitHub features
  private_key_file: ~/shipyard-github.pem
  poll_seconds: 60
  stale_hours: 48
alerts:                                       # Coolify's webhook posts here; the URL carries a secret
  port: 8766
  evidence_lines: 40
  agent: ops-agent
digest:
  hour: 9
  minute: 0
  timezone: Asia/Kolkata

projects:
  demo:
    rooms:                                    # Switch room ids
      ops: ["00000000-0000-0000-0000-000000000001"]          # commands, alerts, diagnosis
      maintainers: ["00000000-0000-0000-0000-000000000002"]  # PR alerts and the digest
    apps:                                     # app name -> Coolify application uuid
      demo-web: "aaaaaaaaaaaaaaaaaaaaaaaa"
    repo:
      name: owner/repo
      app: demo-web                           # deployed after a merge
      required_checks: [test]                 # CI is green only when these succeed
      merge_method: squash
    github_logins:                            # who is who on GitHub, for the digest
      "@switch-discord-BRIDGE-owner:localhost": owner-login
    members:
      "@switch-discord-BRIDGE-owner:localhost": owner
      "@switch-discord-BRIDGE-maint:localhost": maintainer
      "@switch-discord-BRIDGE-deployer:localhost": deployer
      "@switch-discord-BRIDGE-viewer:localhost": viewer

# Tier per action. Unlisted actions are denied (fail closed).
actions:
  coolify.status:    read
  coolify.logs:      read
  coolify.history:   read
  k8s.status:        read
  k8s.logs:          read
  k8s.events:        read
  repo.pr_list:      read
  repo.pr_status:    read
  repo.digest:       read
  audit.read:        read
  sbom.read:         read
  coolify.deploy:    change
  coolify.restart:   change
  k8s.restart:       change
  k8s.scale:         change
  coolify.rollback:  change      # the Phase 1 exit check wants owner approval: see approval_overrides
  repo.merge:        dangerous
  ops.shell:         dangerous
  ops.exec:          dangerous
  secrets.read:      dangerous
  coolify.stop_prod: dangerous
  coolify.delete:    dangerous
  deploy.override_cve_gate: dangerous
  ops.firewall:      blocked
  repo.force_push_main: blocked

# Dangerous actions that need more than maintainer to even request.
min_role:
  ops.shell: owner
  ops.exec: owner

# Change-tier actions that still need an approval (second person or owner).
approval_overrides:
  coolify.rollback: true

approval_timeout_seconds: 600
